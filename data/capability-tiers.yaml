  - dsh-session-projection-cache
  - dsh-storage
  - dsh-storage-domain
  - dsh-storage-json
  - dsh-jobs
  - dsh-jobs-local
  - dsh-tool-jobs
  - dsh-subagent
  - dsh-subagent-fork-in-process
  - dsh-subagent-in-process-driver
  - dsh-subagent-spawn-in-process
  - dsh-tool-subagent
  - dsh-tool-subagent-control
  - dsh-tool-subagent-report
  - dsh-goal
  - dsh-goal-round-driver
  - dsh-tool-goal
