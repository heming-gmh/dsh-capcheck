# capability-tiers.yaml
# DSH cordis 服务 -> 能力分级映射（V0 手工登记版）
# 覆盖官方 @deepseek-ai/dsh-* 包的关键子集 + 若干已知的高危第三方服务。
# 未登记的服务一律在扫描器里落入 "unknown"（拒绝默认安全），不落入本文件的任何分级。

critical:
  # 凭证 / 命令执行 / 审批绕过 —— 一旦拿到，等价于拿到本机 shell + API Key
  - dsh-credentials
  - dsh-credentials-local
  - dsh-bash-local
  - dsh-bash-sandbox
  - dsh-tool-bash
  - dsh-tool-bash-persistent
  - dsh-pwsh-local
  - dsh-pwsh-sandbox
  - dsh-tool-pwsh
  - dsh-user-approval
  - dsh-shell
  - dsh-shell-env
  - dsh-subprocess
  - dsh-subprocess-local
  - dsh-terminal
  - dsh-terminal-bash
  - dsh-native-command
  # 常见第三方高危服务（人工登记，需持续维护）
  - dsh-ssh                     # SSH 执行/隧道
  - "@linxin666/dsh-ssh"

high:
  # 文件系统越权 / 沙箱策略 / 动态代码执行 / 外部进程桥接
  - dsh-fs
  - dsh-fs-local
  - dsh-fs-sandbox
  - dsh-fs-observation-policy
  - dsh-sandbox
  - dsh-sandbox-local
  - dsh-sandbox-policy
  - dsh-sandbox-windows-acl
  - dsh-tool-fs
  - dsh-tool-fs-search
  - dsh-permission-presets
  - dsh-code-runtime
  - dsh-code-runtime-worker-thread
  - dsh-cordis-host-runner
  - dsh-tool-cordis
  - dsh-host-apiproxy
  - dsh-host-directory-picker
  - dsh-host-directory-picker-auto
  - dsh-host-directory-picker-browse
  - dsh-host-directory-picker-native
  - dsh-mcp-client
  - dsh-attachment
  - dsh-attachment-local
  - dsh-tool-web
  - dsh-web-search-deepseek
  - dsh-host-webserver

medium:
  # 会话/历史读取、遥测导出、后台任务、跨会话编排 —— 隐私/数据面，非直接执行面
