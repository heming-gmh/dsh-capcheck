low_prefix_wildcards:
  # 前缀通配：client-ui 系列体量太大，逐个登记不划算，统一按"展示层"归档
  - "dsh-client-ui-"
  - "dsh-client-web"
  - "@linxin666/dsh-client-ui-"

# --- bare cordis SERVICE names (Signal A/B keys) ---
# inject arrays and member-expression hits use short service names, not npm
# package names. Added after first dogfooding run surfaced 'approval'/'sandbox'/
# 'sessions' etc. resolving to unknown despite their owning packages being listed above.
critical_extra_service_names: &crit_svc
  - credentials
  - shell
  - bash
  - approval
  - ssh
high_extra_service_names: &high_svc
  - sandbox
  - fs
  - tools          # ctx.tools: a plugin that can register/override model-facing tools
medium_extra_service_names: &med_svc
  - sessions
  - sessionProjections
  - sessionQuery
  - webServer      # network-facing host server
  - loader         # cordis loader control (can enable/disable/reconfigure other plugins!)
low_extra_service_names: &low_svc
  - systemPrompt
  - commands
  - settings
  - clientModules
